[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rcap-core"
version = "2.0.0"
description = "Core AI engine for solving reCAPTCHA image challenges"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

authors = [
    {name = "Mahdi Marjani", email = "mahdi.marjani.dev@gmail.com"}
]

dependencies = [
    "numpy>=2.2.6,<3",
    "onnxruntime>=1.20,<2",
    "pillow>=10,<13",
    "requests>=2.32.5,<3",
    "tqdm>=4.67.1,<5",
]

[tool.setuptools]
packages = ["rcap_core"]

[project.urls]
Homepage = "https://github.com/mahdi-marjani/rcap-core"
Documentation = "https://github.com/mahdi-marjani/rcap-core"
Repository = "https://github.com/mahdi-marjani/rcap-core.git"
Issues = "https://github.com/mahdi-marjani/rcap-core/issues"